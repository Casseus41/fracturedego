<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#0c0c0e"/>
  <link rel="icon" type="image/svg+xml" href="../logo.svg"/>
  <link rel="apple-touch-icon" href="../logo.svg"/>
  <title>Messages — fractured Ego</title>
  <link rel="stylesheet" href="../css/styles.css"/>
  <style>
    body { display:flex; flex-direction:column; min-height:100vh; }
    main.main { padding-top:24px; padding-bottom:24px; }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <nav class="topnav" data-shell="topnav"></nav>
  <div class="app-wrap">
    <aside class="sidebar" data-shell="sidebar" data-active="messages"></aside>
    <main class="main fade-up" id="main">
      <div class="messages-shell" id="shell">
        <section class="convo-list" aria-label="Conversations">
          <div class="convo-list-head">
            <h1>Messages</h1>
            <button type="button" class="btn btn-primary btn-sm" id="new-btn">✎ New</button>
          </div>
          <div class="convo-items" id="convos"><div class="muted-line" style="padding:16px 18px;">Loading…</div></div>
        </section>

        <section class="thread" id="thread" aria-label="Conversation">
          <div class="thread-empty" id="thread-empty">
            <div class="big">💬</div>
            <div style="font-size:15px;color:var(--text-2);font-weight:600;">Your conversations</div>
            <div style="font-size:13px;max-width:320px;line-height:1.6;">Pick a conversation, or start a new one with any member of the circle.</div>
          </div>
          <div id="thread-live" hidden style="display:contents;">
            <div class="thread-head" id="thread-head"></div>
            <div class="thread-scroll" id="scroll" aria-live="polite"></div>
            <div class="notice-bar" id="thread-notice" hidden style="margin:0 16px 10px;"></div>
            <form class="thread-compose" id="compose">
              <textarea id="msg-input" rows="1" maxlength="4000" placeholder="Write a message…" aria-label="Message"></textarea>
              <button type="submit" class="btn btn-primary" id="send-btn" disabled>Send</button>
            </form>
            <div class="privacy-note">Messages are private between members. To keep the circle safe, the fractured Ego admin team can access conversations.</div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script src="../js/app.js"></script>
  <script src="../js/safety.js"></script>
  <script src="../js/social.js"></script>
  <script src="../js/shell.js"></script>
  <script>
  (async function () {
    const $ = (id) => document.getElementById(id);
    const shell = $('shell'), scroll = $('scroll'), input = $('msg-input'), sendBtn = $('send-btn');
    const me = await FE.ready; const uid = me.user.id;
    let convos = [], active = null, other = null, msgs = [], isParticipant = true, canSend = true, restr = { messaging_suspended: false };

    const dayLabel = (iso) => {
      const d = new Date(iso), t = new Date(); const y = new Date(); y.setDate(t.getDate() - 1);
      if (d.toDateString() === t.toDateString()) return 'Today';
      if (d.toDateString() === y.toDateString()) return 'Yesterday';
      return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    };
    const clock = (iso) => new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

    // ── Conversation list ──
    async function loadConvos() {
      try { convos = await listConversations(); } catch (e) { console.error(e); convos = []; }
      renderConvos();
    }
    function renderConvos() {
      const el = $('convos');
      if (!convos.length) {
        el.innerHTML = `<div class="notif-empty">No conversations yet.<br/><a href="members.html" style="color:var(--pink);">Find a member</a> to say hello.</div>`;
        return;
      }
      el.innerHTML = convos.map((c) => {
        const name = c.other_display_name || 'Former member';
        const preview = c.last_body == null ? 'No messages yet'
          : c.last_deleted ? 'Message deleted' : (c.last_sender_id === uid ? 'You: ' : '') + c.last_body;
        return `<button type="button" class="convo-item${c.conversation_id === active ? ' active' : ''}${c.unread_count ? ' unread' : ''}" data-id="${c.conversation_id}">
          ${avatarHTML({ display_name: name, avatar_path: c.other_avatar_path }, 'md')}
          <span class="convo-meta"><span class="convo-name"><span>${esc(name)}</span><span class="convo-time">${timeAgo(c.last_message_at)}</span></span>
          <span class="convo-preview">${esc(preview)}</span></span>
          ${c.unread_count ? '<span class="unread-dot" aria-label="Unread"></span>' : ''}</button>`;
      }).join('');
      hydrateMedia(el);
    }
    $('convos').addEventListener('click', (e) => { const b = e.target.closest('.convo-item'); if (b) open(b.dataset.id); });

    // ── Thread ──
    async function open(convId) {
      active = convId;
      history.replaceState(null, '', `messages.html?c=${convId}`);
      shell.classList.add('has-thread'); $('thread-empty').hidden = true; $('thread-live').hidden = false;
      scroll.innerHTML = '<div class="muted-line" style="align-self:center;">Loading…</div>';
      renderConvos();
      try {
        const parts = await fetchParticipants(convId);
        isParticipant = parts.some((p) => p.user_id === uid);
        const others = parts.filter((p) => p.user_id !== uid);
        other = others[0]?.member || { display_name: 'Former member' };
        if (!isParticipant) other = { display_name: parts.map((p) => p.member?.display_name || 'Former member').join(' ↔ ') };
        const blocks = await listMyBlocks();
        const iBlocked = other.id && blocks.some((b) => b.blocked_id === other.id);
        renderHead(iBlocked);
        msgs = await fetchMessages(convId);
        renderMessages(true);
        setComposer(iBlocked);
        if (isParticipant) { await markConversationRead(convId); FE.refreshMsgBadge(); const c = convos.find((x) => x.conversation_id === convId); if (c) { c.unread_count = 0; renderConvos(); } }
        if (window.matchMedia('(min-width: 901px)').matches && !input.disabled) input.focus();
      } catch (e) {
        console.error(e);
        scroll.innerHTML = '<div class="thread-empty"><div class="big">🕊️</div>This conversation isn’t available.</div>';
        $('compose').hidden = true;
      }
    }

    function renderHead(iBlocked) {
      $('thread-head').innerHTML = `
        <button type="button" class="icon-btn thread-back" id="back-btn" aria-label="Back to conversations">←</button>
        <a class="who" ${other.id ? `href="profile.html?id=${other.id}"` : ''}>${avatarHTML(other, 'md')}
          <span><span class="who-name">${esc(other.display_name)}</span><br/>
          <span class="who-sub">${!isParticipant ? 'Admin view — you are not a participant' : other.headline ? esc(other.headline) : 'View profile'}</span></span></a>
        ${isParticipant && other.id ? `<div class="menu-wrap"><button type="button" class="icon-btn" id="thread-menu-btn" aria-label="Conversation options">⋯</button>
          <div class="menu-pop" id="thread-menu" hidden>
            <a href="profile.html?id=${other.id}">View profile</a>
            <button type="button" id="block-toggle">${iBlocked ? 'Unblock' : 'Block'} ${esc(other.display_name)}</button>
          </div></div>` : ''}`;
      hydrateMedia($('thread-head'));
      $('back-btn').addEventListener('click', () => { shell.classList.remove('has-thread'); active = null; history.replaceState(null, '', 'messages.html'); renderConvos(); });
      const mb = $('thread-menu-btn');
      if (mb) {
        mb.addEventListener('click', (e) => { e.stopPropagation(); $('thread-menu').hidden = !$('thread-menu').hidden; });
        $('block-toggle').addEventListener('click', async () => {
          try {
            if (iBlocked) { await unblockMember(other.id); toast(`${other.display_name} unblocked.`); }
            else {
              if (!(await uiConfirm(`Block ${other.display_name}?`, 'Neither of you will be able to send messages here, and you won’t see each other’s posts. They aren’t notified.', { confirmLabel: 'Block', danger: true }))) return;
              await blockMember(other.id); toast(`${other.display_name} blocked.`);
            }
            open(active);
          } catch (err) { toast(err.message || 'Something went wrong.', 'error'); }
        });
      }
    }
    document.addEventListener('click', () => { const m = $('thread-menu'); if (m) m.hidden = true; });

    function setComposer(iBlocked) {
      const n = $('thread-notice');
      let reason = '';
      if (!isParticipant) reason = 'You’re viewing this conversation as an admin. Replies are disabled.';
      else if (restr.messaging_suspended) reason = 'Messaging is paused on your account right now. Reach out via Contact Sibeth with any questions.';
      else if (iBlocked) reason = `You’ve blocked ${other.display_name}. Unblock them to send messages.`;
      else if (!other.id) reason = 'This member is no longer active in the circle.';
      canSend = !reason;
      n.hidden = !reason; n.textContent = reason;
      input.disabled = !canSend; $('compose').hidden = !isParticipant;
      sendBtn.disabled = !canSend || !input.value.trim();
    }

    function renderMessages(stickToBottom) {
      const atBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 80;
      if (!msgs.length) {
        scroll.innerHTML = `<div class="thread-empty"><div class="big">👋</div>Say hello to ${esc(other.display_name)}.</div>`;
        return;
      }
      let lastDay = '';
      scroll.innerHTML = msgs.map((m) => {
        const day = dayLabel(m.created_at); const mine = m.sender_id === uid;
        const sep = day !== lastDay ? `<div class="msg-day">${day}</div>` : ''; lastDay = day;
        const deleted = !!m.deleted_at;
        return `${sep}<div class="msg-row${mine ? ' mine' : ''}" data-id="${m.id}">
          <div class="msg-bubble${deleted ? ' deleted' : ''}">${deleted ? 'Message deleted' : linkify(esc(m.body))}</div>
          <div class="msg-side"><span class="msg-time" title="${esc(fullTime(m.created_at))}">${clock(m.created_at)}${m.edited_at && !deleted ? ' · edited' : ''}</span>
            ${!deleted && isParticipant ? (mine ? '<button type="button" data-del>Delete</button>' : '<button type="button" data-report>Report</button>') : ''}</div>
        </div>`;
      }).join('');
      if (stickToBottom || atBottom) scroll.scrollTop = scroll.scrollHeight;
    }

    scroll.addEventListener('click', async (e) => {
      const row = e.target.closest('.msg-row'); if (!row) return;
      if (e.target.closest('[data-del]')) {
        if (!(await uiConfirm('Delete this message?', 'It will show as “Message deleted” for both of you.', { confirmLabel: 'Delete', danger: true }))) return;
        try { await deleteMessage(row.dataset.id); const m = msgs.find((x) => x.id === row.dataset.id); if (m) { m.deleted_at = new Date().toISOString(); m.body = ''; } renderMessages(); }
        catch (err) { toast(err.message || 'Could not delete.', 'error'); }
      } else if (e.target.closest('[data-report]')) {
        openReportDialog('message', row.dataset.id, 'this message');
      }
    });

    // ── Composer ──
    input.addEventListener('input', () => {
      input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px';
      sendBtn.disabled = !canSend || !input.value.trim();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(hover: hover)').matches) { e.preventDefault(); $('compose').requestSubmit(); }
    });
    $('compose').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = input.value.trim(); if (!body || !canSend || !active) return;
      const temp = { id: 'tmp-' + Date.now(), conversation_id: active, sender_id: uid, body, created_at: new Date().toISOString() };
      msgs.push(temp); renderMessages(true);
      input.value = ''; input.style.height = 'auto'; sendBtn.disabled = true;
      try {
        const saved = await sendMessage(active, body);
        const i = msgs.findIndex((m) => m.id === temp.id); if (i > -1) msgs[i] = saved;
        if (msgs.filter((m) => m.id === saved.id).length > 1) msgs.splice(i, 1);
        renderMessages(true); loadConvos();
      } catch (err) {
        msgs = msgs.filter((m) => m.id !== temp.id); renderMessages(true);
        input.value = body; toast(err.message || 'Message not sent.', 'error');
      }
    });

    // ── Live updates ──
    let convoTimer = null, readTimer = null;
    document.addEventListener('fe:message', (e) => {
      const { type, row } = e.detail || {}; if (!row) return;
      if (row.conversation_id === active) {
        const i = msgs.findIndex((m) => m.id === row.id);
        if (i > -1) msgs[i] = row; else if (type === 'INSERT') msgs.push(row);
        renderMessages();
        if (type === 'INSERT' && row.sender_id !== uid && isParticipant) {
          clearTimeout(readTimer); readTimer = setTimeout(async () => { await markConversationRead(active); FE.refreshMsgBadge(); }, 600);
        }
      }
      clearTimeout(convoTimer); convoTimer = setTimeout(loadConvos, 500);
    });
    setInterval(async () => {
      if (document.hidden || !active || String(active).startsWith('tmp')) return;
      try {
        const fresh = await fetchMessages(active);
        const sig = (a) => a.map((m) => m.id + (m.deleted_at ? 'd' : '')).join();
        if (sig(fresh) !== sig(msgs.filter((m) => !String(m.id).startsWith('tmp-')))) { msgs = fresh; renderMessages(); if (isParticipant) markConversationRead(active); }
      } catch (_) {}
    }, 20000);

    // ── New conversation picker ──
    $('new-btn').addEventListener('click', async () => {
      const list = (await listMembers()).filter((m) => m.id !== uid);
      const dlg = openDialog({
        eyebrow: 'New message', title: 'Who would you like to <em>talk to?</em>', confirmLabel: 'Start conversation',
        bodyHTML: `<input type="search" class="text-input" id="pick-q" placeholder="Search members…" autocomplete="off"/>
          <input type="hidden" name="member" id="pick-val"/>
          <div class="picker-list" id="pick-list"></div>`,
      });
      const pl = $('pick-list');
      const draw = (q = '') => {
        const f = list.filter((m) => m.display_name.toLowerCase().includes(q.toLowerCase()));
        pl.innerHTML = f.map((m) => `<button type="button" class="picker-item" data-id="${m.id}">${avatarHTML(m, 'sm')}<span>${esc(m.display_name)}${m.headline ? `<br/><span style="font-size:11.5px;color:var(--text-3);font-weight:400;">${esc(m.headline)}</span>` : ''}</span></button>`).join('')
          || '<div class="muted-line">No members match.</div>';
        hydrateMedia(pl);
      };
      draw(); $('pick-q').addEventListener('input', (e) => draw(e.target.value)); $('pick-q').focus();
      pl.addEventListener('click', (e) => { const b = e.target.closest('.picker-item'); if (!b) return; $('pick-val').value = b.dataset.id; pl.closest('form').requestSubmit(); });
      const vals = await dlg;
      if (!vals || !vals.member) return;
      try { const conv = await startConversation(vals.member); await loadConvos(); open(conv); }
      catch (err) { toast(err.message, 'error'); }
    });

    // ── Boot ──
    restr = await getMyRestrictions();
    await loadConvos();
    const p = new URLSearchParams(location.search);
    if (p.get('to')) {
      try { const conv = await startConversation(p.get('to')); await loadConvos(); open(conv); } catch (err) { toast(err.message, 'error'); }
    } else if (p.get('c')) open(p.get('c'));
    else if (convos.length && window.matchMedia('(min-width: 901px)').matches) open(convos[0].conversation_id);
  })();
  </script>
</body>
</html>
